name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Opt into Node 24
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - run: npm ci

      - run: npm run build

      - name: Verify build artifacts
        run: |
          test -f main.js || (echo "main.js missing" && exit 1)
          test -f styles.css || (echo "styles.css missing" && exit 1)
          test -f manifest.json || (echo "manifest.json missing" && exit 1)
          node -e "const m = require('./manifest.json'); if (!m.id || !m.version) throw new Error('Invalid manifest')"
          # Verify obsidian module is externalized: check that main.js does not contain
          # the obsidian source code (which would appear if bundled, vs just a require() call)
          OBSIDIAN_SOURCE_MARKER="ApiImplementation"
          if grep -q "$OBSIDIAN_SOURCE_MARKER" main.js; then echo "ERROR: obsidian source appears to be bundled" && exit 1; fi
          # sanity check: main.js should be a reasonable size (< 1MB) for a plugin bundle
          SIZE=$(wc -c < main.js)
          if [ "$SIZE" -gt 1048576 ]; then echo "ERROR: main.js is suspiciously large ($SIZE bytes)" && exit 1; fi

      - name: TypeScript type check
        run: npx tsc --noEmit
